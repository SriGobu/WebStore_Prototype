<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link id="app-manifest" rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/headerLogo.svg" />

    <title>WebStore — Discover the best tools, websites & apps</title>
    <meta
      name="description"
      content="WebStore is a curated marketplace for discovering, reviewing, and publishing web tools, apps, and services."
    />

    <!-- Open Graph — default/fallback for any page without its own per-page tags -->
    <meta
      property="og:title"
      content="WebStore — Discover the best tools, websites & apps"
    />
    <meta
      property="og:description"
      content="A curated marketplace for discovering, reviewing, and publishing web tools, apps, and services."
    />
    <meta
      property="og:image"
      content="https://web-store-prototype.onrender.com/previewLogo.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://web-store-prototype.onrender.com/" />

    <!-- Twitter/X uses its own tag set, doesn't fall back to og:* automatically -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="WebStore — Discover the best tools, websites & apps"
    />
    <meta
      name="twitter:description"
      content="A curated marketplace for discovering, reviewing, and publishing web tools, apps, and services."
    />
    <meta
      name="twitter:image"
      content="https://web-store-prototype.onrender.com/previewLogo.png"
    />
    <meta name="google-site-verification" content="FdfuW4_BeAblB9VXXYVq-UmIhVLE-yviH1tNgE4BBxQ" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
